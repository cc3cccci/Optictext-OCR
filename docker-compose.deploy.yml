# 设备端「仅镜像」部署配置(不在设备上构建)。
# 配合 deploy_image.sh:在 Mac mini 上构建好 arm64 镜像并 docker load 到设备后,
# 用本文件 `docker compose -f docker-compose.deploy.yml up -d` 直接起容器。
# 与 docker-compose.yml 的唯一区别:去掉 build:,并设 pull_policy: never(镜像已本地加载,绝不联网拉取)。
services:
  ocr-app:
    image: optictext-ocr:latest
    pull_policy: never
    container_name: optictext-ocr
    ports:
      - "9999:8000"
    volumes:
      - ./data:/app/data
    restart: always
    mem_limit: 2g
    cpus: 3.0
    environment:
      OMP_NUM_THREADS: "2"
      ORT_INTRA_OP: "2"
      OPENCV_FOR_THREADS_NUM: "2"
    tmpfs:
      - /tmp
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
