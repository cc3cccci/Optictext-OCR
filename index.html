<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpticText OCR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: "#C5A059", // Metallic Gold
              "primary-dark": "#A68545",
              "bg-cream": "#FDFBF7", // Cream
              "bg-dark": "#1C1611", // Deep Bronze
              "surface-light": "#F7F2E8", // Darker Cream
              "surface-dark": "#2A2118", // Surface Bronze
              "surface-dark-lighter": "#3D3025",
              "text-brown": "#422A12",
              "text-cream": "#F3EFE5",
              "border-sepia": "#E6DCC8",
              "border-bronze": "#3C2F24"
            },
            fontFamily: {
              sans: ["'Plus Jakarta Sans'", "sans-serif"],
              mono: ["'JetBrains Mono'", "monospace"],
              serif: ["'Playfair Display'", "serif"],
            },
            animation: {
                'scan-line': 'scan 3s ease-in-out infinite',
            },
            keyframes: {
                scan: {
                    '0%, 100%': { top: '0%', opacity: '0' },
                    '10%': { opacity: '1' },
                    '50%': { top: '100%', opacity: '1' },
                    '90%': { opacity: '1' }
                }
            }
          },
        },
      }
    </script>
    <style>
      body {
        margin: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* Custom Scrollbar for a premium feel */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(197, 160, 89, 0.3);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(197, 160, 89, 0.6);
      }
    </style>

}
