<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4E3B2C" />
    <title>OpticText 文字识别</title>
    <script>
      // Apply the persisted Quiet Surface colorway before first paint (no FOUC).
      (function () {
        try {
          var ids = ['latte', 'honey', 'clay', 'mist', 'sage', 'plum', 'charcoal', 'slate'];
          var saved = localStorage.getItem('optictext_colorway');
          var cw = ids.indexOf(saved) >= 0 ? saved : 'latte';
          document.documentElement.setAttribute('data-colorway', cw);
          document.documentElement.classList.toggle('dark', cw === 'charcoal' || cw === 'slate');
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234E3B2C' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='3'/%3E%3Cpath d='M3 7V5a2 2 0 0 1 2-2h2'/%3E%3Cpath d='M17 3h2a2 2 0 0 1 2 2v2'/%3E%3Cpath d='M21 17v2a2 2 0 0 1-2 2h-2'/%3E%3Cpath d='M7 21H5a2 2 0 0 1-2-2v-2'/%3E%3C/svg%3E" />
  </head>
  <body class="bg-bg text-ink dark:bg-bg-dark dark:text-ink-dark overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
