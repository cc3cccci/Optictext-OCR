services:
  ocr-app:
    build: .
    image: optictext-ocr:latest
    container_name: optictext-ocr
    ports:
      # 对外服务端口 9999(容器内 8000)
      - "9999:8000"
    volumes:
      # 识别历史数据库与图片,持久化到宿主机,升级/重建容器不丢失
      - ./data:/app/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
